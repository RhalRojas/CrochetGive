{% extends "shop/base.html" %}
{% block content %}

<div class="card">
    <h2>Thank you for your order! 🎉</h2>
    <p><strong>Order #{{ order.id }}</strong></p>
    <p>Total paid: ₱{{ order.total_amount }}</p>
    <p>Donated to cause: ₱{{ order.donation_amount }}</p>
    <p>Goes to seller: ₱{{ order.seller_amount }}</p>
    <p><a href="{% url 'product_list' %}">Back to shop</a></p>
</div>

{% endblock %}
