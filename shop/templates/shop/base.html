<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CrochetGive</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; color: #222; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .donated-banner { background: #fdf1e7; border: 1px solid #e8c9a8; border-radius: 8px; padding: 10px 16px; margin-bottom: 20px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; color: white; margin-left: 8px; }
        .cache-hit { background: #2e7d32; }
        .cache-miss { background: #999; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        input[type=number] { width: 60px; padding: 4px; }
        button { padding: 8px 16px; margin-top: 15px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🧶 CrochetGive</h1>
    </header>
    {% if messages %}
        {% for message in messages %}<p style="color: red;">{{ message }}</p>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
